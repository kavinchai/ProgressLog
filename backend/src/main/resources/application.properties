# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── DataSource (all values injected from environment variables) ──────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Cookie ───────────────────────────────────────────────────────────────────
app.cookie.secure=${COOKIE_SECURE:true}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── App URL (used in password-reset email links) ─────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.password-reset.ttl-minutes=${PASSWORD_RESET_TTL_MINUTES:5}

# ── Mail (SMTP) ──────────────────────────────────────────────────────────────
# Leave SMTP_HOST unset to disable real sending — MailService will log instead.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:true}
app.mail.from=${MAIL_FROM:no-reply@progresslog.local}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.kavin.fitness=INFO
logging.level.org.springframework.security=WARN
