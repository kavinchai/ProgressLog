# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
# Gzip JSON responses over 2 KB; full-history lists shrink several times over.
server.compression.enabled=true

# ── DataSource (all values injected from environment variables) ──────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── JWT ──────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.remember-me-expiration-ms=${JWT_REMEMBER_ME_EXPIRATION_MS:2592000000}

# Sign in with Apple. client-id is the iOS app's bundle id. The key settings
# (a "Sign in with Apple" key from the Apple Developer account) let account
# deletion revoke the Apple sign-in; leave them empty to turn that off.
app.apple.client-id=${APPLE_CLIENT_ID:com.kavin.progresslog}
app.apple.team-id=${APPLE_TEAM_ID:}
app.apple.key-id=${APPLE_KEY_ID:}
app.apple.private-key=${APPLE_PRIVATE_KEY:}

# ── Cookie ───────────────────────────────────────────────────────────────────
app.cookie.secure=${COOKIE_SECURE:true}

# ── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.kavin.fitness=INFO
logging.level.org.springframework.security=WARN
