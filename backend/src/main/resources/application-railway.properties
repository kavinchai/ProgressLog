# ── Logging (Railway) ─────────────────────────────────────────────────────────
# Production logging: keep application logs at INFO and frameworks at WARN.
# Avoid DEBUG/TRACE here — logging every SQL statement with its bound parameters
# is noisy and can leak user data into the log stream.
logging.level.com.kavin.fitness=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.flywaydb=INFO
logging.level.com.zaxxer.hikari=WARN

# SQL is not logged in production. Flip these to DEBUG/TRACE in a dev profile
# (or temporarily) when you need to inspect queries.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Log format: plain text works best in Railway's log viewer (no ANSI colour codes)
spring.output.ansi.enabled=never
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
